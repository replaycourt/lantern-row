# Tests for the client and the contract, and rebuilds of the contract that are compared with the
# code deployed on lantern-row.testnet. Read-only: it reads the deployed code from a public RPC, sends
# no transaction and holds no key.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Client tests (node --test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # No install: the client and its tests use only the browser and Node's standard library.
      - run: node --test 'web/test/*.test.mjs'

  contract:
    name: Contract tests (cargo test)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install the toolchain pinned in contract/rust-toolchain.toml
        working-directory: contract
        run: |
          TOOLCHAIN=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$TOOLCHAIN" --profile minimal --component rustfmt,clippy --target wasm32-unknown-unknown
          rustc --version
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contract -> target
          shared-key: contract-test
      - name: cargo test
        working-directory: contract
        run: cargo test --locked

  # Rebuilds the contract from this source and compares the result with the code deployed on the
  # contract account, fetched from the chain in the same job (RPC view_code), not only with the
  # number in contract/WASM_SHA256. The deployed wasm was built on the author's Intel Mac. Every
  # platform reports how its rebuild compares, section by section; set `required: true` on a platform
  # once its rebuild matches the chain (see "Rebuilding the deployed wasm" in the docs).
  # The cargo-near version is in CARGO_NEAR_RELEASE, not CARGO_NEAR_VERSION: cargo-near reads
  # CARGO_NEAR_VERSION and writes it into the ABI embedded in the wasm (build.sh unsets it as well).
  wasm:
    name: Rebuild the wasm on ${{ matrix.label }} and compare it with the deployed code
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            label: macOS x86_64
            required: false
            cargo_near_asset: cargo-near-x86_64-apple-darwin
            # sha256 of cargo-near-x86_64-apple-darwin.tar.gz from the cargo-near v0.22.0 release
            cargo_near_sha256: 50899ccfc3492530ded7cebf191365b732ed29bfe62a1a13a661f126cff3ce65
          - os: ubuntu-latest
            label: Linux x86_64
            required: false
            cargo_near_asset: cargo-near-x86_64-unknown-linux-gnu
            # sha256 of cargo-near-x86_64-unknown-linux-gnu.tar.gz from the cargo-near v0.22.0 release
            cargo_near_sha256: 9429064e30a427e96523f539cb255f3688d2345e5000d7d4e4873a8247247d1a
          - os: macos-15
            label: macOS arm64
            required: false
            cargo_near_asset: cargo-near-aarch64-apple-darwin
            # sha256 of cargo-near-aarch64-apple-darwin.tar.gz from the cargo-near v0.22.0 release
            cargo_near_sha256: 55bd219c28c6996512a7c3836519f160b27b73a723f087634bf16f8a0bd48c8a
    env:
      CARGO_NEAR_RELEASE: 0.22.0
      CONTRACT_ACCOUNT: lantern-row.testnet
      WASM_NAME: lantern_row.wasm
    steps:
      - uses: actions/checkout@v4
      - name: Install the toolchain pinned in contract/rust-toolchain.toml
        working-directory: contract
        run: |
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          TOOLCHAIN=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$TOOLCHAIN" --profile minimal --component rustfmt,clippy --target wasm32-unknown-unknown
          rustc -vV
      - name: Install cargo-near ${{ env.CARGO_NEAR_RELEASE }} (release binary, checksum pinned)
        run: |
          NAME=${{ matrix.cargo_near_asset }}
          curl --proto '=https' --tlsv1.2 -fsSL -o "$RUNNER_TEMP/$NAME.tar.gz" \
            "https://github.com/near/cargo-near/releases/download/cargo-near-v$CARGO_NEAR_RELEASE/$NAME.tar.gz"
          echo "${{ matrix.cargo_near_sha256 }}  $RUNNER_TEMP/$NAME.tar.gz" | shasum -a 256 -c -
          tar -xzf "$RUNNER_TEMP/$NAME.tar.gz" -C "$RUNNER_TEMP"
          mkdir -p "$HOME/.cargo/bin"
          install -m 0755 "$RUNNER_TEMP/$NAME/cargo-near" "$HOME/.cargo/bin/cargo-near"
          cargo near --version
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contract -> target
          shared-key: contract-wasm
      - name: Rebuild, then compare with contract/WASM_SHA256 and with the code on chain
        working-directory: contract
        env:
          REQUIRED: ${{ matrix.required }}
        run: |
          set +e
          ./build.sh --check 2> build.log
          build=$?
          cat build.log
          compare=2
          if [ -f "target/near/$WASM_NAME" ]; then
            python3 compare-wasm.py "target/near/$WASM_NAME" --account "$CONTRACT_ACCOUNT" > compare.log 2>&1
            compare=$?
            cat compare.log
          fi
          set -e
          built=$(sed -n 's/^sha256 \([0-9a-f]\{64\}\) .*/\1/p' build.log)
          pin=$(sed -n 's/^host pin: //p' build.log)
          case "$build/$compare" in
            0/0) verdict=identical ;;
            0/2) verdict=unread ;;
            0/1|3/*) verdict=different ;;
            *) verdict=failed ;;
          esac
          {
            echo "### Rebuild on ${{ matrix.label }} (\`${{ matrix.os }}\`)"
            echo ""
            echo "- toolchain: \`$(rustc --version)\`, \`$(cargo near --version)\`"
            echo "- host pin: ${pin:-not reported}"
            echo "- built here: \`${built:-none}\`"
            echo "- contract/WASM_SHA256: \`$(tr -d '[:space:]' < WASM_SHA256)\`"
            case $verdict in
              identical) echo "- result: **byte-identical** to the code deployed on \`$CONTRACT_ACCOUNT\`, read from the chain in this job." ;;
              unread) echo "- result: **matches** contract/WASM_SHA256; the chain could not be read in this job (see the log)." ;;
              different)
                if [ "$REQUIRED" = true ]; then
                  echo "- result: **DIFFERENT** from the deployed code. On this platform the rebuild must be byte-identical."
                else
                  echo "- result: **different** from the deployed code, which was built on macOS x86_64. A byte-identical rebuild on this platform is not established; the comparison below shows where the bytes differ."
                fi ;;
              failed) echo "- result: **build.sh failed** (exit $build), see the log." ;;
            esac
            if [ -f compare.log ]; then
              echo ""
              echo '```'
              cat compare.log
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          case $verdict in
            identical) ;;
            unread) echo "::warning title=chain not read::compare-wasm.py could not fetch the code of $CONTRACT_ACCOUNT; the hash matched contract/WASM_SHA256" ;;
            different)
              if [ "$REQUIRED" = true ]; then
                echo "::error title=wasm differs on ${{ matrix.label }}::build.sh exit $build, compare-wasm.py exit $compare; see the job summary"
                exit 1
              fi
              echo "::warning title=wasm differs on ${{ matrix.label }}::built ${built:-none}; the deployed wasm was built on macOS x86_64. See the job summary for the section comparison." ;;
            failed)
              echo "::error title=build.sh failed::exit code $build, see the log above"
              exit 1 ;;
          esac
      - name: Upload the wasm built here
        if: always() && hashFiles(format('contract/target/near/{0}', env.WASM_NAME)) != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.WASM_NAME }}-${{ matrix.os }}
          path: contract/target/near/${{ env.WASM_NAME }}
          if-no-files-found: ignore

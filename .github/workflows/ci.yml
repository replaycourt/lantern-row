# Tests for the client and the contract, and a rebuild of the contract that is compared with the
# code hash deployed on lantern-row.testnet (contract/WASM_SHA256). Read-only: nothing here talks to
# the chain or holds a key.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Client tests (node --test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # No install: the client and its tests use only the browser and Node's standard library.
      - run: node --test 'web/test/*.test.mjs'

  contract:
    name: Contract tests (cargo test)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install the toolchain pinned in contract/rust-toolchain.toml
        working-directory: contract
        run: |
          TOOLCHAIN=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$TOOLCHAIN" --profile minimal --component rustfmt,clippy --target wasm32-unknown-unknown
          rustc --version
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contract -> target
          shared-key: contract-test
      - name: cargo test
        working-directory: contract
        run: cargo test --locked

  wasm:
    name: Rebuild the wasm and compare its hash
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_NEAR_VERSION: 0.22.0
      # sha256 of cargo-near-x86_64-unknown-linux-gnu.tar.gz from the cargo-near v0.22.0 release
      CARGO_NEAR_SHA256: 9429064e30a427e96523f539cb255f3688d2345e5000d7d4e4873a8247247d1a
    steps:
      - uses: actions/checkout@v4
      - name: Install the toolchain pinned in contract/rust-toolchain.toml
        working-directory: contract
        run: |
          TOOLCHAIN=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$TOOLCHAIN" --profile minimal --component rustfmt,clippy --target wasm32-unknown-unknown
          rustc --version
      - name: Install cargo-near ${{ env.CARGO_NEAR_VERSION }} (release binary, checksum pinned)
        run: |
          NAME=cargo-near-x86_64-unknown-linux-gnu
          curl --proto '=https' --tlsv1.2 -fsSL -o "$RUNNER_TEMP/$NAME.tar.gz" \
            "https://github.com/near/cargo-near/releases/download/cargo-near-v$CARGO_NEAR_VERSION/$NAME.tar.gz"
          echo "$CARGO_NEAR_SHA256  $RUNNER_TEMP/$NAME.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$NAME.tar.gz" -C "$RUNNER_TEMP"
          mkdir -p "$HOME/.cargo/bin"
          install -m 0755 "$RUNNER_TEMP/$NAME/cargo-near" "$HOME/.cargo/bin/cargo-near"
          cargo near --version
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contract -> target
          shared-key: contract-wasm
      - name: build.sh --check
        working-directory: contract
        run: |
          set +e
          ./build.sh --check 2> build.log
          code=$?
          set -e
          cat build.log
          built=$(sed -n 's/^sha256 \([0-9a-f]\{64\}\) .*/\1/p' build.log)
          expected=$(tr -d '[:space:]' < WASM_SHA256)
          {
            echo "### Rebuilding the contract on Linux"
            echo ""
            echo "- toolchain: \`$(rustc --version)\`, \`$(cargo near --version)\`"
            echo "- built here: \`${built:-none}\`"
            echo "- contract/WASM_SHA256 (the code hash on lantern-row.testnet): \`$expected\`"
          } >> "$GITHUB_STEP_SUMMARY"
          case $code in
            0)
              echo "- result: **match.** This source, built on a GitHub Linux runner, is the code deployed on lantern-row.testnet." >> "$GITHUB_STEP_SUMMARY"
              ;;
            3)
              # Not a test failure: the deployed wasm was built on macOS and the build is not
              # containerised. Say so loudly instead of hiding it or failing the whole run.
              echo "- result: **no match on this runner.** The deployed wasm was built and reproduced with build.sh --check on macOS (x86_64); a Linux build of the same source and toolchain gave the hash above. The contract tests are unaffected." >> "$GITHUB_STEP_SUMMARY"
              echo "::warning title=wasm hash differs on Linux::built $built, contract/WASM_SHA256 is $expected (deployed build made on macOS). See the job summary."
              ;;
            *)
              echo "::error title=build.sh failed::exit code $code, see the log above"
              exit "$code"
              ;;
          esac

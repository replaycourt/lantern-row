[package]
name = "lantern-row"
description = "Lantern Row: a night-market trading game whose whole economy runs on a NEAR contract with no owner"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30"
near-contract-standards = "5.30"

[dev-dependencies]
near-sdk = { version = "5.30", features = ["unit-testing"] }
ed25519-dalek = { version = "2", default-features = false, features = ["std", "fast"] }
near-parameters = "0.38.0"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(near)']

# The tests and the economy simulation drive the real contract through the mock VM; optimising the
# dependencies keeps a thousand-night run fast.
[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1
